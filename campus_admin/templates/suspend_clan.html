<!doctype html><html><head><meta charset="utf-8"><title>Suspend Clan</title><style>body{font-family:Arial;background:#f4f6f8}.card{max-width:650px;margin:40px auto;background:#fff;padding:25px;border-radius:14px}select,textarea{width:100%;padding:10px;margin:7px 0 15px;box-sizing:border-box}.btn{padding:10px 14px;border:0;border-radius:7px;background:#222;color:#fff;text-decoration:none}.danger{background:#b00020}</style></head><body><div class="card"><h1>Suspend {{ clan.name }}</h1><p>The clan remains visible, but its clan actions should be blocked while suspended.</p><form method="post">{% csrf_token %}<label>Duration</label><select name="days" required><option value="">Select</option><option>1</option><option>3</option><option>7</option><option>15</option><option>30</option><option>60</option><option>90</option></select><label>Reason</label><textarea name="reason"></textarea><button class="btn danger">Suspend</button> <a class="btn" href="{% url 'campus_admin_clan_view' clan.id %}">Cancel</a></form></div></body></html>
