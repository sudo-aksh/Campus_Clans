<!doctype html><html><head><meta charset="utf-8"><title>Message Student</title><style>body{font-family:Arial;background:#f4f6f8}.card{max-width:750px;margin:30px auto;background:#fff;padding:25px;border-radius:14px}input,textarea{width:100%;padding:10px;margin:6px 0 15px;box-sizing:border-box}.btn{padding:10px 14px;background:#222;color:#fff;border:0;border-radius:7px;text-decoration:none}</style></head><body><div class="card"><h1>Message {{ student.name }}</h1><form method="post">{% csrf_token %}<label>Subject</label><input name="subject" required><label>Message</label><textarea name="message" rows="8" required></textarea><button class="btn">Send</button><a class="btn" href="{% url 'campus_admin_student_view' student.id %}">Back</a></form><h2>History</h2>{% for m in message_history %}<div style="border-top:1px solid #eee;padding:12px"><b>{{ m.subject }}</b><p>{{ m.message }}</p><small>{{ m.created_at }}</small><form method="post" action="{% url 'campus_admin_delete_message' student.id m.id %}">{% csrf_token %}<button>Delete</button></form></div>{% empty %}No messages.{% endfor %}</div></body></html>
