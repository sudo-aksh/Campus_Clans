<!doctype html><html><head><meta charset="utf-8"><title>Delete Student</title><style>body{font-family:Arial;background:#f4f6f8}.card{max-width:600px;margin:60px auto;background:#fff;padding:30px;border-radius:14px}.btn{padding:10px 15px;border:0;border-radius:7px;background:#222;color:#fff;text-decoration:none}.danger{background:#b00020}</style></head><body><div class="card"><h1>Permanently Delete Student</h1><p>This permanently deletes <b>{{ student.name }}</b> and the login account. This cannot be undone.</p><form method="post">{% csrf_token %}<button class="btn danger">Permanently Delete</button><a class="btn" href="{% url 'campus_admin_student_view' student.id %}">Cancel</a></form></div></body></html>
