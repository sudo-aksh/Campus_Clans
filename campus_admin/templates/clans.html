<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clans</title><style>body{font-family:Arial;background:#f4f6f8;margin:0}.wrap{max-width:1200px;margin:auto;padding:25px}.bar{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px;margin-top:20px}.card{background:#fff;padding:20px;border-radius:14px}.btn{display:inline-block;padding:9px 12px;background:#222;color:#fff;border-radius:7px;text-decoration:none}.s{color:#b00020;font-weight:bold}</style></head><body><div class="wrap"><div class="bar"><h1>Clans</h1><a class="btn" href="{% url 'campus_admin_dashboard' %}">Dashboard</a></div><form><input name="search" value="{{ search }}" placeholder="Search clan" style="padding:10px;width:300px"><button class="btn">Search</button></form><div class="grid">{% for clan in clans %}<div class="card"><h2>{{ clan.name }}</h2><p>{{ clan.speciality }}</p><p>Members: {{ clan.members.count }}</p>{% if clan.id in suspended_ids %}<p class="s">SUSPENDED</p>{% endif %}<a class="btn" href="{% url 'campus_admin_clan_view' clan.id %}">Manage Clan</a></div>{% empty %}<p>No clans.</p>{% endfor %}</div></div></body></html>
