<!doctype html><html><head><meta charset="utf-8"><title>Edit Clan</title><style>body{font-family:Arial;background:#f4f6f8}.card{max-width:800px;margin:30px auto;background:#fff;padding:25px;border-radius:14px}input,textarea{width:100%;padding:10px;margin:5px 0 15px;box-sizing:border-box}.btn{padding:10px 15px;background:#222;color:#fff;border:0;border-radius:7px;text-decoration:none}</style></head><body><div class="card"><h1>Edit {{ clan.name }}</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn">Save</button> <a class="btn" href="{% url 'campus_admin_clan_view' clan.id %}">Cancel</a></form></div></body></html>
