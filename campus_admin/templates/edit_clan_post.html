<!doctype html><html><head><meta charset="utf-8"><title>Edit Post</title><style>body{font-family:Arial;background:#f4f6f8}.card{max-width:850px;margin:30px auto;background:#fff;padding:25px;border-radius:14px}textarea,input{width:100%;padding:10px;margin:6px 0 15px;box-sizing:border-box}.media{max-width:180px;max-height:130px;object-fit:cover;margin:5px}.btn{padding:10px 14px;background:#222;color:#fff;border:0;border-radius:7px;text-decoration:none}.error{background:#ffe0e0;padding:12px;color:#900}</style></head><body><div class="card"><h1>Edit Clan Post</h1>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data">{% csrf_token %}<label>Caption</label><textarea name="content">{{ post.content }}</textarea><label>Text</label><textarea name="text">{{ post.text }}</textarea><h3>Existing images</h3>{% for im in post.images.all %}<label><img class="media" src="{{ im.image.url }}"><input type="checkbox" name="remove_images" value="{{ im.id }}"> Remove</label>{% empty %}None{% endfor %}{% if post.video %}<p>Existing video: <video class="media" controls src="{{ post.video.url }}"></video><br><label><input type="checkbox" name="remove_video" value="1"> Remove video</label></p>{% endif %}<label>Add images/videos (video max 60 sec / 50 MB)</label><input type="file" name="media" multiple accept="image/*,video/*"><button class="btn">Save</button> <a class="btn" href="{% url 'campus_admin_clan_view' post.clan_id %}">Cancel</a></form></div></body></html>
