
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Story - {{ clan.name }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        select,
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        select:focus,
        textarea:focus {
            border-color: #555;
        }

        .section {
            display: none;
        }

        .caption-section {
            display: none;
        }

        .hint {
            font-size: 13px;
            color: #777;
            margin-top: -12px;
            margin-bottom: 20px;
        }

        .error {
            background: #ffe8e8;
            color: #b00020;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .preview {
            display: none;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            margin-bottom: 20px;
        }

        .preview img,
        .preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 11px 20px;
            border-radius: 9px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel {
            background: #eee;
            color: #333;
        }

        .publish {
            background: #111;
            color: white;
        }

        .publish:hover {
            opacity: .9;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Create Clan Story
        </h1>

        <div class="subtitle">
            {{ clan.name }}
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form
            method="POST"
            action="{% url 'create_clan_story' clan.id %}"
            enctype="multipart/form-data"
            id="storyForm"
        >

            {% csrf_token %}


            <!-- STORY TYPE -->

            <label for="story_type">
                Story Type
            </label>

            <select
                id="story_type"
                name="story_type"
                required
            >

                <option value="">
                    Select story type
                </option>

                <option value="text">
                    Text
                </option>

                <option value="image">
                    Image
                </option>

                <option value="video">
                    Video
                </option>

            </select>


            <!-- TEXT -->

            <div
                class="section"
                id="textSection"
            >

                <label for="text">
                    Story Text
                </label>

                <textarea
                    id="text"
                    name="text"
                    placeholder="Write something for your clan..."
                ></textarea>

                <div class="hint">
                    Text stories remain visible for 10 seconds.
                </div>

            </div>


            <!-- IMAGE -->

            <div
                class="section"
                id="imageSection"
            >

                <label for="image">
                    Story Image
                </label>

                <input
                    type="file"
                    id="image"
                    name="image"
                    accept="image/*"
                >

                <div class="hint">
                    Image stories are displayed in a 16:9 viewer
                    and remain visible for 10 seconds.
                </div>


                <div
                    class="preview"
                    id="imagePreviewBox"
                >

                    <img
                        id="imagePreview"
                        alt="Image preview"
                    >

                </div>

            </div>


            <!-- VIDEO -->

            <div
                class="section"
                id="videoSection"
            >

                <label for="video">
                    Story Video
                </label>

                <input
                    type="file"
                    id="video"
                    name="video"
                    accept="video/*"
                >

                <div class="hint">
                    Maximum video length: 30 seconds.
                </div>


                <div
                    class="preview"
                    id="videoPreviewBox"
                >

                    <video
                        id="videoPreview"
                        controls
                    ></video>

                </div>

            </div>


            <!-- SHARED CAPTION -->

            <div
                class="caption-section"
                id="captionSection"
            >

                <label for="caption">
                    Caption
                </label>

                <textarea
                    id="caption"
                    name="caption"
                    maxlength="1000"
                    placeholder="Write a caption..."
                ></textarea>

            </div>


            <div class="actions">

                <a
                    href="{% url 'clan_profile' clan.id %}"
                    class="btn cancel"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn publish"
                >
                    Publish Story
                </button>

            </div>

        </form>

    </div>

</div>


<script>

const storyType =
    document.getElementById("story_type");

const textSection =
    document.getElementById("textSection");

const imageSection =
    document.getElementById("imageSection");

const videoSection =
    document.getElementById("videoSection");

const captionSection =
    document.getElementById("captionSection");

const caption =
    document.getElementById("caption");

const imageInput =
    document.getElementById("image");

const videoInput =
    document.getElementById("video");

const imagePreviewBox =
    document.getElementById("imagePreviewBox");

const imagePreview =
    document.getElementById("imagePreview");

const videoPreviewBox =
    document.getElementById("videoPreviewBox");

const videoPreview =
    document.getElementById("videoPreview");


function updateSections() {

    textSection.style.display = "none";
    imageSection.style.display = "none";
    videoSection.style.display = "none";

    captionSection.style.display = "none";

    imagePreviewBox.style.display = "none";
    videoPreviewBox.style.display = "none";


    if (storyType.value === "text") {

        textSection.style.display = "block";

        caption.value = "";

    }


    if (storyType.value === "image") {

        imageSection.style.display = "block";

        captionSection.style.display = "block";

        caption.placeholder =
            "Write a caption for your image...";

    }


    if (storyType.value === "video") {

        videoSection.style.display = "block";

        captionSection.style.display = "block";

        caption.placeholder =
            "Write a caption for your video...";

    }

}


storyType.addEventListener(
    "change",
    updateSections
);


imageInput.addEventListener(
    "change",
    function () {

        const file = this.files[0];

        if (!file) {

            imagePreviewBox.style.display =
                "none";

            return;
        }

        imagePreview.src =
            URL.createObjectURL(file);

        imagePreviewBox.style.display =
            "block";
    }
);


videoInput.addEventListener(
    "change",
    function () {

        const file = this.files[0];

        if (!file) {

            videoPreviewBox.style.display =
                "none";

            return;
        }

        videoPreview.src =
            URL.createObjectURL(file);

        videoPreviewBox.style.display =
            "block";


        videoPreview.onloadedmetadata =
            function () {

                if (
                    videoPreview.duration > 30
                ) {

                    alert(
                        "Video must be 30 seconds or shorter."
                    );

                    videoInput.value = "";

                    videoPreview.removeAttribute(
                        "src"
                    );

                    videoPreview.load();

                    videoPreviewBox.style.display =
                        "none";
                }

            };

    }
);

</script>

</body>

</html>
