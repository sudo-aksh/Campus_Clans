<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Add Project Update</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f4f6f8;margin:0}
.container{max-width:800px;margin:30px auto;padding:20px}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
h1{margin-top:0}
label{display:block;font-weight:bold;margin:15px 0 7px}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px}
textarea{min-height:180px;resize:vertical}
button{margin-top:20px;padding:11px 20px;border:0;border-radius:7px;background:#4f46e5;color:white;cursor:pointer}
.back{display:inline-block;margin-bottom:20px;color:#4f46e5;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<a href="{% url 'student_project_detail' project.id %}" class="back">← Back to Project</a>
<div class="card">
<h1>Add Project Update</h1>
<p>{{ project.title }}</p>
<form method="POST" enctype="multipart/form-data">
{% csrf_token %}
<label for="title">Update Title</label>
<input type="text" id="title" name="title" placeholder="What did you work on?" required>
<label for="content">Update / Blog</label>
<textarea id="content" name="content" placeholder="Describe your progress, work, challenges, achievements, etc." required></textarea>
<label for="images">Photos</label>
<input type="file" id="images" name="images" accept="image/*" multiple>
<button type="submit">Publish Update</button>
</form>
</div>
</div>
</body>
</html>
